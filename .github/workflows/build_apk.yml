name: Build LinoVPN Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android Gradle Skeleton
        run: |
          mkdir -p /tmp/lino_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/lino_backup/AndroidManifest.xml
          flutter create . --platforms=android --org=com.linovpn
          cp /tmp/lino_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinoVPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
