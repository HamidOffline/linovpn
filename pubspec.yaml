name: linovpn_app
description: "اپلیکیشن اختصاصی اندروید LinoVPN با اتصال هوشمند و مدیریت اشتراک"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # مدیریت وضعیت و ذخیره‌سازی محلی
  shared_preferences: ^2.2.2
  # ارتباط شبکه و دریافت لینک ساب
  http: ^1.2.0
  # کتابخانه رسمی و پایدار هسته ویتوری (Xray/V2Ray Core برای اندروید)
  flutter_v2ray: ^1.2.2
  # نمایش تاریخ و انقضا
  intl: ^0.19.0
  # طراحی گرافیکی نوار پیشرفت و انیمیشن‌ها
  percent_indicator: ^4.2.3
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
